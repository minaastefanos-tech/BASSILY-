<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>BASSILY MANAGEMENT SYSTEM</title>
<meta property="og:title" content="BASSILY MANAGEMENT SYSTEM"><meta property="og:description" content="نظام باسيلي لإدارة الموظفين والمهام والإجازات - شركة باسيلي للمقاولات والتجارة"><meta property="og:type" content="website"><meta property="og:image" content="og-image.png"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:image" content="og-image.png"><meta name="description" content="نظام باسيلي لإدارة الموظفين والمهام والإجازات">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3fa;--card:rgba(255,255,255,.78);--tx:#0f2342;--mu:#5d6b82;--nv:#002a5c;--bl:#0b6cb8;--gr:#16a34a;--rd:#dc2626;--or:#f59e0b;--ln:rgba(0,42,92,.12);--sh:0 8px 28px rgba(0,42,92,.10);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0a1424;--card:rgba(20,34,58,.8);--tx:#e6eefb;--mu:#9fb0ca;--ln:rgba(255,255,255,.12);--sh:0 8px 28px rgba(0,0,0,.4)}}
:root[data-theme=dark]{--bg:#0a1424;--card:rgba(20,34,58,.8);--tx:#e6eefb;--mu:#9fb0ca;--ln:rgba(255,255,255,.12);--sh:0 8px 28px rgba(0,0,0,.4)}
*{box-sizing:border-box}html,body{margin:0}body{font-family:Cairo,Tahoma,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
.logo{height:34px;max-width:100%}.logo.big{height:56px}
.card{background:var(--card);backdrop-filter:blur(10px);border:1px solid var(--ln);border-radius:16px;box-shadow:var(--sh);padding:16px}
.btn{border:0;border-radius:10px;padding:8px 14px;cursor:pointer;background:#64748b;color:#fff;font-weight:600;transition:.15s}.btn:hover{filter:brightness(1.1)}.btn:active{transform:scale(.96)}
.btn.g{background:var(--gr)}.btn.r{background:var(--rd)}.btn.o{background:var(--or)}.btn.b{background:var(--bl)}.btn.s{padding:4px 10px;font-size:.85em}
input,select,textarea{width:100%;padding:9px 12px;border-radius:10px;border:1px solid var(--ln);background:var(--card)}
label{display:block;margin:10px 0 4px;font-size:.9em;color:var(--mu)}
#login{min-height:100vh;display:grid;place-items:center;padding:16px;background:linear-gradient(135deg,#002a5c,#0b6cb8)}
#login .card{width:min(420px,100%);text-align:center;background:var(--bg)}
.app{display:flex;min-height:100vh}
aside{width:250px;background:var(--nv);color:#fff;padding:14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow:auto;transition:.2s}
aside .lg{background:#fff;border-radius:12px;padding:8px;margin-bottom:10px}
aside button{background:none;border:0;color:#cfe0f7;text-align:right;padding:10px 12px;border-radius:10px;cursor:pointer;display:flex;gap:10px;align-items:center}
aside button:hover,aside button.on{background:rgba(255,255,255,.14);color:#fff}
.collapsed aside{width:64px}.collapsed aside span.t,.collapsed aside .lg{display:none}
main{flex:1;padding:18px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.st b{font-size:1.9em;display:block;color:var(--bl)}.st span{color:var(--mu);font-size:.9em}
table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid var(--ln);text-align:right;font-size:.92em}
.tw{overflow-x:auto}
.tag{padding:2px 10px;border-radius:99px;color:#fff;font-size:.8em;white-space:nowrap}
.bar{display:flex;align-items:flex-end;gap:14px;height:140px;padding-top:10px}.bar div{flex:1;background:var(--bl);border-radius:8px 8px 0 0;text-align:center;color:#fff;font-size:.8em;min-height:4px;transition:height .6s}
#md{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;place-items:center;padding:12px;z-index:9}#md.on{display:grid}
#md .card{width:min(520px,100%);max-height:90vh;overflow:auto;background:var(--bg)}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--nv);color:#fff;padding:10px 18px;border-radius:12px;display:none;z-index:99}
.sg{height:46px;background:#fff;border-radius:8px;padding:2px}
@media(max-width:760px){aside{position:fixed;z-index:5;right:0;transform:translateX(100%);width:240px}.open aside{transform:none}.collapsed aside{width:240px}.collapsed aside span.t{display:inline}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
:focus-visible{outline:3px solid var(--or);outline-offset:2px}
.lg2{--d:.05s;position:relative;min-height:100vh;overflow:hidden;background:radial-gradient(1200px 700px at 80% -10%,#0b4f93 0,transparent 60%),linear-gradient(160deg,#001230,#002a5c 55%,#001a3d);color:#fff;display:grid;place-items:center;padding:20px}
.lg2 .orb{position:absolute;border-radius:50%;filter:blur(70px);opacity:.5;animation:fl 14s ease-in-out infinite alternate}
.lg2 .o1{width:380px;height:380px;background:#0b6cb8;top:-90px;left:-80px}.lg2 .o2{width:300px;height:300px;background:#d4a437;opacity:.18;bottom:-80px;right:10%;animation-duration:18s}.lg2 .o3{width:260px;height:260px;background:#16a34a;opacity:.12;top:40%;left:35%;animation-duration:22s}
@keyframes fl{to{transform:translate(60px,40px) scale(1.15)}}
.lg2 .gb{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:44px 44px;-webkit-mask-image:radial-gradient(circle at 50% 50%,#000 0,transparent 75%);mask-image:radial-gradient(circle at 50% 50%,#000 0,transparent 75%)}
.lg2 .stage{position:relative;z-index:2;display:grid;grid-template-columns:1.1fr 1fr;gap:48px;align-items:center;width:min(980px,100%)}
.lg2 .brand{text-align:center;animation:up .9s var(--d) both}
.lg2 .plate{display:inline-block;background:#fff;border-radius:22px;padding:16px 26px;box-shadow:0 20px 60px rgba(0,0,0,.45),0 0 0 6px rgba(255,255,255,.08)}
.lg2 .plate img{height:76px;display:block;max-width:100%}
.lg2 .brand h1{font-size:clamp(2.2rem,6vw,3.6rem);letter-spacing:.35em;margin:26px 0 0;font-weight:800;padding-inline-start:.35em;background:linear-gradient(90deg,#fff,#cfe0f7,#fff);-webkit-background-clip:text;background-clip:text;color:transparent}
.lg2 .sub{letter-spacing:.5em;font-size:.8rem;opacity:.75;margin-top:4px;padding-inline-start:.5em}
.lg2 .rule{width:90px;height:3px;margin:20px auto;border-radius:3px;background:linear-gradient(90deg,transparent,#d4a437,transparent)}
.lg2 .brand p{opacity:.8;margin:0}
.lg2 .panel{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-radius:22px;padding:26px;box-shadow:0 30px 80px rgba(0,0,0,.4);animation:up .9s calc(var(--d) + .15s) both}
.lg2 .panel h2{margin:0 0 14px}
.lg2 .seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:rgba(0,0,0,.25);padding:5px;border-radius:14px}
.lg2 .seg button{border:0;background:none;color:#cfe0f7;padding:11px;border-radius:10px;cursor:pointer;font-weight:700;transition:.2s}
.lg2 .seg button.on{background:linear-gradient(135deg,#0b6cb8,#1d8be0);color:#fff;box-shadow:0 6px 18px rgba(11,108,184,.5)}
.lg2 label{color:#b9c9e3}
.lg2 input,.lg2 select{background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.22)}
.lg2 input::placeholder{color:rgba(255,255,255,.4)}
.lg2 .pw{display:flex;gap:6px}.lg2 .pw button{border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);color:#cfe0f7;border-radius:10px;padding:0 12px;cursor:pointer}
.lg2 .go{width:100%;margin-top:16px;border:0;border-radius:12px;padding:13px;font-weight:800;font-size:1.05rem;color:#001a3d;background:linear-gradient(135deg,#e6b94a,#d4a437);cursor:pointer;box-shadow:0 10px 28px rgba(212,164,55,.35);transition:.15s}.lg2 .go:hover{filter:brightness(1.08)}.lg2 .go:active{transform:scale(.98)}
.lg2 .alt{width:100%;margin-top:10px;background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:12px;padding:11px;cursor:pointer;font-weight:700}.lg2 .alt:hover{background:rgba(255,255,255,.1)}
.lg2 .lnk{display:block;margin:14px auto 0;background:none;border:0;color:#9fc4ee;cursor:pointer;text-decoration:underline}
.spl{position:fixed;inset:0;z-index:20;display:grid;place-content:center;justify-items:center;gap:18px;background:radial-gradient(circle at 50% 40%,#0b4f93,#001230 70%);animation:so .7s 1.7s ease forwards;cursor:pointer}
.spl-l{background:#fff;border-radius:24px;padding:18px 30px;animation:pop 1s cubic-bezier(.2,.9,.3,1.2) both,glow 2s .6s ease-in-out infinite}.spl-l img{height:90px;display:block;max-width:80vw}
.spl-t{color:#fff;letter-spacing:.5em;padding-inline-start:.5em;font-size:1.6rem;font-weight:800;animation:up .8s .5s both}
.spl-b{width:160px;height:3px;border-radius:3px;background:rgba(255,255,255,.15);overflow:hidden;position:relative}.spl-b:after{content:'';position:absolute;inset:0;background:#d4a437;transform:translateX(100%);animation:ld 1.3s .3s ease forwards}
@keyframes so{to{opacity:0;visibility:hidden}}@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}@keyframes glow{50%{box-shadow:0 0 0 14px rgba(255,255,255,.08),0 0 60px rgba(11,108,184,.7)}}@keyframes ld{to{transform:none}}@keyframes up{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@media(max-width:820px){.lg2 .stage{grid-template-columns:1fr;gap:26px}.lg2 .plate img{height:56px}.lg2 .brand h1{margin-top:16px}.lg2 .rule{margin:12px auto}}
@media(prefers-reduced-motion:reduce){.lg2 *{animation:none!important}.spl{display:none}}
.dmy{display:flex;gap:6px;max-width:360px}.dmy select{padding:9px 6px}
.ld{height:12px;border-radius:99px;background:var(--ln);overflow:hidden;margin:8px 0 4px}.ld div{height:100%;background:linear-gradient(90deg,var(--bl),var(--gr),var(--bl));background-size:200% 100%;border-radius:99px;transition:width .6s;animation:sh 1.6s linear infinite}@keyframes sh{to{background-position:-200% 0}}.gl{animation:gl 2s ease-in-out infinite}@keyframes gl{50%{box-shadow:0 0 0 3px rgba(22,163,74,.35),0 0 24px rgba(22,163,74,.55)}}.th{width:56px;height:56px;object-fit:cover;border-radius:8px;margin:2px;cursor:pointer}
@media(prefers-reduced-motion:reduce){.ld div,.gl{animation:none}}
</style></head><body>
