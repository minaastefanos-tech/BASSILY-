#login::before{content:"";position:absolute;inset:0;width:auto;height:auto;top:0;right:0;border-radius:0;background:radial-gradient(ellipse at 30% 70%,#ffffff22,transparent 55%),radial-gradient(ellipse at 75% 60%,#8ec5ff2e,transparent 50%);animation:mist 16s ease-in-out infinite alternate}
#login::after{display:none}
@keyframes mist{from{transform:translateX(-4%)}to{transform:translateX(4%)}}
.lbox{background:linear-gradient(145deg,#2a4fd055,#0b1e5c66);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid #ffffff3a;border-radius:20px;padding:34px 36px;width:min(440px,92vw);box-shadow:0 20px 60px #020a3099}
.lbox::before{display:none}
.lbox .lt{color:#fff;font-size:34px;margin:6px 0 14px;font-weight:700}.lbox h1{color:#dbe8ff;font-size:13px;letter-spacing:.6px}.lbox p{color:#b9cffb}
.llogo{background:#fff;border-radius:14px;padding:8px;width:190px}
.lbox .pw input{height:54px;border-radius:40px;background:#ffffff14 url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='22' height='22' fill='none' stroke='white' stroke-width='2'><rect x='4' y='10' width='14' height='10' rx='2'/><path d='M7 10V7a4 4 0 018 0v3'/></svg>") no-repeat left 18px center;border:1.5px solid #ffffff66;color:#fff;padding:0 54px 0 90px}
.lbox input::placeholder{color:#dbe8ffcc}
.lbox .pw button{left:50px;top:15px;color:#cfe0ff;font-size:12px}
.lbox .err{color:#ffb4b4}
#lbtn{background:#fff!important;color:#1d4fd8;border-radius:40px;height:54px;font-size:17px;font-weight:700;animation:none;box-shadow:0 8px 24px #0a1f7a66}
#dev{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:120;background:linear-gradient(135deg,#0b2a8f,#1f6bff);color:#fff;border-radius:16px;padding:12px 22px;box-shadow:0 12px 34px #0b2a8f77;border:1px solid #ffffff44;animation:devin .6s cubic-bezier(.2,.9,.3,1.2) both;max-width:94vw}
#dev div{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:14px}#dev b{font-size:16px}#dev span{background:#ffffff1f;border-radius:20px;padding:2px 12px;font-size:13px}
#dev.out{animation:devout .8s ease both}@keyframes devin{from{transform:translate(-50%,-90px);opacity:0}to{transform:translate(-50%,0);opacity:1}}@keyframes devout{to{transform:translate(-50%,-90px);opacity:0}}
.clk .cl2{font-family:Rajdhani,Cairo,sans-serif;font-size:60px;font-weight:600;letter-spacing:5px;background:none;border:0;padding:0;line-height:1;text-shadow:0 0 22px #3d8bff;font-variant-numeric:tabular-nums}
.clk .cl2 small{font-family:Rajdhani,sans-serif;background:#ffb703;color:#0b1e5c;border-radius:6px;padding:2px 10px;font-size:18px;font-weight:700;letter-spacing:1px;align-self:center}
.wx{display:flex;flex-wrap:wrap;gap:0;margin-bottom:16px;background:var(--card);border-radius:16px;overflow:hidden;box-shadow:0 2px 14px #0002}
.wxs{direction:ltr;position:relative;overflow:hidden;flex:0 0 280px;min-height:230px;background:linear-gradient(#3a8dff,#bfe3ff)}
.wxs.cloud,.wxs.fog{background:linear-gradient(#6f84a0,#c3cddb)}.wxs.rain{background:linear-gradient(#34435e,#6c7b92)}.wxs.storm{background:linear-gradient(#1c2438,#4a566e)}.wxs.snow{background:linear-gradient(#8fa6c4,#e6eef8)}
.wxs.n{background:linear-gradient(#050f3a,#1b3a8f)}.wxs.n.cloud,.wxs.n.rain{background:linear-gradient(#0a1440,#2a3b6e)}
.wxs .sun{position:absolute;top:26px;right:34px;width:58px;height:58px;border-radius:50%;background:radial-gradient(#fff6b0,#ffc933);box-shadow:0 0 34px 12px #ffd34d88;animation:sunp 3s ease-in-out infinite}
.wxs .sun::before{content:"";position:absolute;inset:-26px;border-radius:50%;background:repeating-conic-gradient(#ffe06688 0 6deg,transparent 6deg 24deg);-webkit-mask:radial-gradient(circle,transparent 31px,#000 32px);mask:radial-gradient(circle,transparent 31px,#000 32px);animation:spin 24s linear infinite}
.wxs .moon{display:none;position:absolute;top:28px;right:40px;width:46px;height:46px;border-radius:50%;box-shadow:inset -14px -4px 0 0 #f3f6ff;filter:drop-shadow(0 0 10px #cfe0ff)}
.wxs.n .sun{display:none}.wxs.n .moon{display:block}.wxs.rain .sun,.wxs.storm .sun,.wxs.cloud .sun,.wxs.fog .sun{display:none}
.wxs.n::before{content:"";position:absolute;inset:0;background:radial-gradient(1.5px 1.5px at 20% 25%,#fff,transparent),radial-gradient(1.5px 1.5px at 60% 15%,#fff,transparent),radial-gradient(2px 2px at 80% 40%,#fff,transparent),radial-gradient(1.5px 1.5px at 35% 55%,#fff,transparent),radial-gradient(1px 1px at 50% 35%,#fff,transparent);animation:tw 3s ease-in-out infinite}
.wxs .cl{position:absolute;width:96px;height:30px;background:var(--cc,#fff);border-radius:30px;opacity:.95;filter:drop-shadow(0 4px 6px #0003);animation:drift 26s linear infinite;left:-130px}
.wxs .cl::before,.wxs .cl::after{content:"";position:absolute;background:var(--cc,#fff);border-radius:50%}.wxs .cl::before{width:44px;height:44px;top:-20px;left:14px}.wxs .cl::after{width:32px;height:32px;top:-13px;left:52px}
.wxs .c1{top:46px}.wxs .c2{top:98px;transform:scale(.7);animation-duration:36s;animation-delay:-12s}.wxs .c3{top:70px;transform:scale(.5);animation-duration:44s;animation-delay:-24s}
.wxs.rain .cl,.wxs.storm .cl,.wxs.cloud .cl{--cc:#9aa6b8}.wxs.storm .cl,.wxs.n .cl{--cc:#5d6a85}.wxs.clear .cl{opacity:.0}
.wxs .dr{position:absolute;inset:0;display:none}.wxs.rain .dr,.wxs.storm .dr{display:block}.wxs .dr b{position:absolute;top:-20px;width:2px;height:16px;background:linear-gradient(transparent,#d6ecff);animation:fall .8s linear infinite}
.wxs.storm::after{content:"";position:absolute;inset:0;background:#fff;opacity:0;animation:flash 6s infinite}
@keyframes fall{to{transform:translateY(260px)}}@keyframes drift{to{left:110%}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes sunp{50%{transform:scale(1.07)}}@keyframes tw{50%{opacity:.4}}@keyframes flash{0%,90%,96%,100%{opacity:0}92%{opacity:.55}94%{opacity:.25}}
.wxi{flex:1;min-width:290px;padding:18px 22px;display:flex;flex-direction:column;gap:12px}
.wxh{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap}.wxh .t{font:600 58px/1 Rajdhani,Cairo,sans-serif;color:var(--navy)}.wxh .d{font-size:18px;font-weight:700}.wxh small{display:block;color:var(--mut);font-weight:400;font-size:13px}

const logo=w=>`<img src='${LOGO}' style='width:${w}mm;display:block'>`;
const nowS=()=>new Date().toLocaleString('ar-EG-u-nu-latn');
const loc=n=>n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0');
const tier=(i,b=480)=>{if(i==null)return'';const d=i-b;return d>30?'يوم كامل':d==30?'نصف يوم':d>15?'ربع يوم':''};
const prevD=d=>{const x=new Date(d+'T12:00:00');x.setDate(x.getDate()-1);return loc(x)};
const dec=msg=>new Promise(res=>{const o=ov(`<p style='color:var(--bad);font-weight:700'>⚠ تنبيه تأخير</p><p>${esc(msg)}</p><div class='tools'><button class='btn bad' id='dy'>تطبيق الخصم</button><button class='btn ok' id='dn'>عدم الخصم</button></div>`);o.querySelector('#dy').onclick=()=>{o.remove();res(true)};o.querySelector('#dn').onclick=()=>{o.remove();res(false)}});
const attPanel=()=>{const d=loc(new Date());return `<div class='card noprint att-panel' style='margin-bottom:14px'><div class='clk'><div><div class='cd1' id='cdw'></div><div class='cd2' id='cd'></div></div><div class='cl2'><span id='ck'></span><small id='cs'></small></div></div><h2 style='font-size:16px'>تسجيل الحضور والانصراف</h2><div class='form' style='align-items:end'><div><label>📅 تاريخ اليوم (يمكن تعديله)</label><input type='date' id='qd' value='${d}'></div><div><label>👤 الموظف</label>${inp(['qe','','emp'])}</div><div id='qcw' style='display:none'><label>🚗 السيارة (للسائق)</label>${inp(['qc','','car'])}</div><div><label>🧾 الإذن (إن وُجد)</label><select id='qp'><option value=''>— بدون إذن —</option></select></div><div class='tbox in'><label>⏰ وقت حضور هذا اليوم</label><input type='time' id='qti'></div><div class='tbox out'><label>🏁 وقت الانصراف</label><input type='time' id='qto'></div><div class='tbox out'><label>📅 يوم الانصراف (افتراضيًا اليوم السابق — عدّله لو جمعة أو غيره)</label><input type='time' style='display:none'><input type='date' id='qdo' value='${defOut(d)}'></div><div><button class='btn ok' data-a='qsave'>حفظ</button></div></div><div id='qi' style='margin-top:8px;font-size:13px;color:var(--mut)'></div></div>`};
async function attIn(){const emp=$('#g_qe').value,d=$('#qd').value,t=$('#qt').value;if(!emp||!d||!t)return toast('اختر الموظف والتاريخ والوقت',1);const A=D('att');if(A.some(r=>r.emp==emp&&r.wd==d))return toast('يوجد حضور مسجل لهذا الموظف في هذا اليوم',1);const lv=lvOn(emp,d);if(lv&&!await ask('الموظف '+en(emp)+' في إجازة ('+lv.type+(lv.why?' — '+lv.why:'')+') في هذا اليوم. هل تريد تسجيل حضور رغم ذلك؟'))return;
const r={id:Math.max(0,...A.map(x=>x.id))+1,emp,wd:d,in:t,out:'',ded:'لم يُقرر',note:'',car:(isDrv(emp)?($('#g_qc').value||''):''),created:nowS(),entered:nowS()},tr=tier(tm(t));
if(tr)r.ded=(await dec('الموظف '+en(emp)+' حضر الساعة '+t+' (متأخر). يمكنك تطبيق خصم '+tr+' أو عدم الخصم، والقرار لك.'))?'تطبيق الخصم':'عدم الخصم';
A.push(r);S('d_att',A);logA('الحضور والانصراف','إضافة','تسجيل حضور '+en(emp)+' يوم '+d+' الساعة '+t+(tr?' — تأخير ('+tr+') — '+r.ded:''),null,r);toast('تم تسجيل الحضور');mod('att')}
function attOut(){const emp=$('#g_qe').value,d=$('#qd').value,t=$('#qt').value;if(!emp||!d||!t)return toast('اختر الموظف والتاريخ والوقت',1);const pv=prevD(d),A=D('att'),r=A.find(x=>x.emp==emp&&x.wd==pv);if(!r)return toast('لا يوجد حضور مسجل لـ '+en(emp)+' بتاريخ '+pv+' لتسجيل انصرافه',1);

[['سيستم','نظام','اشرح','شرح','كل حاجه','ايه ده','مقدمه','تعمل ايه'],'نظام **BASSILY** لإدارة الشركة. القائمة الجانبية فيها: لوحة التحكم، إدارة الموظفين، التأمينات الاجتماعية، الإجازات والأذونات (وفيها تبويب الإجازات الرسمية)، المرتبات (والخصومات)، الحضور والانصراف، الجزاءات، إدارة السيارات (الصيانة والتفويل وتغيير الزيت)، الأرشيف العام، النسخ الاحتياطي، والإعدادات. فوق فيه بحث شامل وزر طباعة وحالة المزامنة.',['اشرح الحضور والانصراف','اشرح الجزاءات','اشرح المرتبات']],
[['لوحه','داش','الرئيسيه'],'**لوحة التحكم**: ساعة وتاريخ، طقس الإسكندرية مع تنبيهات الأمطار والرياح والحرارة، وإحصائيات: عدد الموظفين (ثابت/سركي)، المؤمن عليهم، المقبلون على المعاش، الحضور والمتأخرون وأذونات اليوم، المرتبات ومصروفات السيارات وتنبيهات الرخص، وآخر 5 موظفين.',['اشرح إدارة الموظفين']],
[['موظف','موظفين','اضيف موظف','بيانات الموظف','طباعه موظف'],'**إدارة الموظفين**: زر «إضافة موظف» ثم الاسم وتاريخ الميلاد (السن تلقائي) والرقم القومي (14 رقم ولا يتكرر) والعنوان (المنطقة + العقار + الشارع يكتب العنوان تلقائيًا) والوظيفة والقسم والتأمين وتاريخ الالتحاق والصورة. النظام يحدد النوع من الاسم: للأنثى يكتب عزباء/متزوجة ويضيف التاء المربوطة للوظيفة ويخفي الموقف من التجنيد (وتقدر تغيّر النوع يدويًا). «عرض» يفتح الملف و«طباعة A4» يطبع كل البيانات حتى تاريخ الالتحاق.',['ازاي أطبع بيانات موظف؟']],
[['تامين','تامينات','معاش','60'],'**التأمينات**: لكل موظف الأجر التأميني الأساسي والشامل، وحصة العامل 11% وحصة الشركة 18.75% ومدة التأمين وتاريخ بلوغ 60 سنة، ومن يقترب من الستين (خلال سنة) يظهر بتنبيه أحمر وامض.',[]],
[['اجازه','اجازات','عارضه','بدون مرتب','اعتيادي'],'**الإجازات**: اختر الموظف ثم **النوع**: اعتيادي (مناسبة عائلية / ظرف شخصي / سفر) أو عارضة (مرضي / عملية / إجازة معتمدة من المستشفى) أو بدون مرتب (بدون سبب). بعدها اختر **تاريخ بداية الإجازة** و**تاريخ العودة للعمل**، وفيه مستطيل **سبب الإجازة** اختياري. عدد الأيام يستثني الجمعة والإجازات الرسمية. لو الموظف حضر يوم وهو في إجازة تلغي اليوم ده فقط من صفحة الحضور، فتتحدث تواريخ الإجازة وتتسجل ملاحظة تحت السبب بالأيام اللي حضر فيها، وتفضل التواريخ الأصلية ظاهرة في الإيصال مع خانات التعديل.',['ازاي ألغي يوم من إجازة؟']],
[['اذن','اذونات'],'**الأذونات**: تاريخ ومن/إلى الساعة والسبب. لو الموظف حضر أبكر أو أتأخر عن ميعاد الإذن اضغط «تعديل الميعاد» من صفحة الحضور وأكتب الميعاد الصحيح: يتسجل في الملاحظات «كان لديه إذن من .. إلى .. وحضر الساعة ..»، ويظهر في التقرير وإيصال الإذن تلقائيًا، وخانتا الحضور والانصراف تفضلان فاضيتين.',[]],
[['مرتب','مرتبات','خصومات','صافي','ضريبه'],'**المرتبات**: كشف شهري (أساسي + حوافز + بدلات + مزايا عينية)، وتبويب **الخصومات**: حصة العامل والشركة تُجلب تلقائيًا من التأمينات والضريبة تكتبها يدويًا، ويحسب الصافي.',[]],
[['حضور','انصراف','تاخير','تأخير','انتظام'],'**الحضور والانصراف**: اختر التاريخ والموظف ثم وقت الحضور و/أو الانصراف واضغط حفظ. **الانتظام**: الحضور قبل 8:00 وحتى 8:02 يُحسب يوم انتظام، وفي تقرير الشهر تجد أيام الانتظام وأيام الإضافي وساعاته بالتواريخ. التأخير: مسموح 15 دقيقة، بعدها ربع يوم، 30 دقيقة نصف يوم، وأكثر يوم كامل، والقرار بالخصم لك. لو الموظف عنده إجازة/جزاء/إذن يظهر إشعار فور اختيار اسمه ويُسجَّل تلقائيًا. تقدر تلغي يوم واحد فقط من الإجازة أو الجزاء وتسجل حضوره. فيه تقارير شهرية PDF وصورة وExcel.',['إزاي أعدل ميعاد إذن؟','سجل حضور موظف']],
[['جزاء','جزاءات','فصل','خصم','عفو'],'**الجزاءات**: اختر السبب والجزاء (خصم ربع يوم / نصف يوم / يوم / يومين / ثلاثة / فصل / أخرى). اكتب تاريخ بداية الخصم والنظام يحسب النهاية تلقائيًا (بدون الجمعة). لو ألغيت يوم من الجزاء من صفحة الحضور تفضل التواريخ الأصلية وتتسجل ملاحظة «تم العفو وحضوره»، وفي الخصومات تجد عدد الأيام الأساسي والمعفو عنه والفعلي بالتواريخ.',[]],
[['سياره','سيارات','صيانه','تفويل','زيت','رخصه'],'**إدارة السيارات**: بيانات السيارات (والرخصة والتأمين مع تنبيه قبل 30 يوم)، الصيانة، التفويل، وتغيير الزيت مع إجماليات المصروفات. السائق يربط سيارته عند تسجيل الحضور.',[]],
[['ارشيف','سجل العمليات'],'**الأرشيف العام**: كل إضافة وتعديل وحذف تُسجَّل في مجلدات سنة ← شهر ← يوم مع تقارير يومية وشهرية وسنوية بالمصروفات.',[]],
[['نسخ','احتياطي','استعاده','باك اب','backup'],'**النسخ الاحتياطي**: إنشاء نسخة JSON (بنافذة حفظ الجهاز لتختار المكان والاسم)، واستعادة بالدمج بدون فقد البيانات الحديثة، ومحو البيانات التشغيلية مع الاحتفاظ بالموظفين.',[]],
[['مزامنه','اوف لاين','offline','انترنت','اجهزه','سوبابيز','supabase'],'**أوف لاين/أون لاين**: النظام يعمل بدون إنترنت ويحفظ كل شيء على الجهاز، وعند عودة الإنترنت يتزامن تلقائيًا مع قاعدة بيانات Supabase وتظهر البيانات على كل الأجهزة.',[]],
[['طباعه','احفظ','حفظ','pdf','اطبع'],'**الطباعة والحفظ**: زر «🖨 طباعة» فوق يعمل في كل الصفحات. أي «حفظ PDF/Excel/صورة/نسخة احتياطية» يفتح نافذة الحفظ الخاصة بجهازك لاختيار المكان والاسم (Chrome/Edge على الكمبيوتر؛ وعلى الآيفون عبر «حفظ في الملفات»).',[]],
[['اعدادات','باسورد','كلمه المرور'],'**الإعدادات**: تغيير كلمة المرور، وحالة المزامنة مع Supabase، والنسخ الاحتياطي والاستعادة.',[]]];

const CG_PAGES={dash:['dash'],emp:['emp'],ins:['ins'],leave:['leave'],perm:['leave'],hol:['leave'],pay:['pay'],ded:['pay'],att:['att'],pen:['pen'],cars:['cars'],maint:['cars'],fuel:['cars'],oil:['cars'],arch:['arch'],bkp:['bkp'],settings:['settings']};
const CG_PNAME={dash:'لوحة التحكم',emp:'إدارة الموظفين',ins:'التأمينات',leave:'الإجازات',perm:'الأذونات',hol:'الإجازات الرسمية',pay:'المرتبات',ded:'الخصومات',att:'الحضور والانصراف',pen:'الجزاءات',cars:'السيارات',maint:'الصيانة',fuel:'التفويل',oil:'تغيير الزيت',arch:'الأرشيف العام',bkp:'النسخ الاحتياطي',settings:'الإعدادات'};

let GH=null;const gh=()=>{if(!GH){GH=document.createElement('div');GH.id='cg-ghost';GH.innerHTML="<svg viewBox='0 0 24 24' width='30' height='30'><path d='M4 2l16 9-7 2-3 7z' fill='#fff' stroke='#1b2540' stroke-width='1.6' stroke-linejoin='round'/></svg>";document.body.appendChild(GH)}return GH};
const gPos=el=>{const r=el.getBoundingClientRect();return[r.left+Math.min(r.width/2,70),r.top+r.height/2]};
async function gTo(el){const g=gh();el.scrollIntoView({block:'center',inline:'center',behavior:'smooth'});await sleep(450);const[x,y]=gPos(el);g.style.opacity='1';g.style.transform='translate('+x+'px,'+y+'px)';await sleep(780);el.classList.add('cg-hl')}
const gOff=el=>el&&el.classList.remove('cg-hl');
async function gClick(el){if(!el)throw new Error('عنصر غير موجود');await gTo(el);const[x,y]=gPos(el),p=document.createElement('div');p.className='cg-rip';p.style.left=x+'px';p.style.top=y+'px';document.body.appendChild(p);setTimeout(()=>p.remove(),700);await sleep(250);el.click();gOff(el);await sleep(450)}
async function gSet(el,val){if(!el)throw new Error('حقل غير موجود');await gTo(el);el.focus();const typ=el.tagName=='TEXTAREA'||(el.tagName=='INPUT'&&/^(text|search|number|)$/.test(el.type));
if(typ){el.value='';for(const ch of String(val)){el.value+=ch;el.dispatchEvent(new Event('input',{bubbles:true}));await sleep(55)}}else{await sleep(300);el.value=val;el.dispatchEvent(new Event('input',{bubbles:true}))}el.dispatchEvent(new Event('change',{bubbles:true}));await sleep(280);gOff(el)}
async function gSel(el,pred){if(!el)throw new Error('قائمة غير موجودة');await gTo(el);const o=[...el.options].find(pred);if(!o){gOff(el);return false}el.value=o.value;el.dispatchEvent(new Event('input',{bubbles:true}));el.dispatchEvent(new Event('change',{bubbles:true}));await sleep(320);gOff(el);return true}
const gSelT=(el,t)=>{const n=nz(t);return gSel(el,o=>nz(o.textContent)==n)||gSel(el,o=>nz(o.textContent).includes(n))};
const gSelV=(el,v)=>gSel(el,o=>String(o.value)==String(v));
const hhmm=t=>{const m=String(t||'').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).match(/(\d{1,2})(?::(\d{2}))?/);if(!m)return'';return String(Math.min(23,+m[1])).padStart(2,'0')+':'+(m[2]||'00')};
async function cgGoto(p){const q=P2[p];if(!q)return false;if(innerWidth<=800?!$('#side').classList.contains('open'):$('#app').classList.contains('sbc'))await gClick($('#mb'));const a=document.querySelector('aside a[data-p="'+q[0]+'"]');if(!a)return false;
if(!(page==q[0]&&(!q[1]||tabSel[q[0]]==q[1]||(!tabSel[q[0]]&&TABS[q[0]]&&TABS[q[0]][0]==q[1]))&&fm===null&&viewId===null&&editId===null))await gClick(a);
if(q[1]){const tb=document.querySelector('#view .tab[data-k="'+q[1]+'"]');if(tb&&!tb.classList.contains('on'))await gClick(tb)}await sleep(250);return true}
function cgFind(name){const n=nz(name||'').replace(/\s+/g,' ').trim();if(!n)return{err:'لم يُحدَّد اسم الموظف'};const all=emps();let r=all.filter(e=>nz(e.name)==n);if(!r.length)r=all.filter(e=>nz(e.name).includes(n));if(!r.length){const ts=n.split(' ');r=all.filter(e=>ts.every(t=>nz(e.name).includes(t)))}
if(!r.length)return{err:'لا يوجد موظف باسم «'+name+'»'};if(r.length>1)return{err:'أكثر من موظف مطابق: '+r.map(e=>e.name).join('، ')+' — حدد الاسم كاملًا'};return{e:r[0]}}
const dlgOpen=()=>[...document.body.children].some(c=>c.style&&c.style.zIndex=='99');
const okd=d=>/^\d{4}-\d{2}-\d{2}$/.test(d||'')?d:loc(new Date());
async function cgSave(){await gClick(document.querySelector('#view [data-a=save]'));await sleep(500);return dlgOpen()}
const CG_ACT={
async open_page(a){if(!await cgGoto(a.page))return{ok:false,error:'صفحة غير معروفة'};return{ok:true,message:'تم فتح صفحة '+(CG_PNAME[a.page]||a.page)}},
async search(a){const g=$('#gs');await gSet(g,a.query||'');return{ok:true,message:'تم البحث عن «'+a.query+'» وظهرت النتائج'}},
async show_employee(a){const f=cgFind(a.employee);if(f.err)return{ok:false,error:f.err};await cgGoto('emp');const b=document.querySelector('#view [onclick="viewE('+f.e.id+')"]');if(!b)return{ok:false,error:'لم أجد زر العرض'};await gClick(b);return{ok:true,message:'تم فتح ملف '+f.e.name}},
async register_attendance(a){const f=cgFind(a.employee);if(f.err)return{ok:false,error:f.err};const e=f.e,d=okd(a.date);await cgGoto('att');if($('#qd').value!=d)await gSet($('#qd'),d);if(!await gSelV($('#g_qe'),e.id))return{ok:false,error:'تعذر اختيار الموظف'};await sleep(300);
const nt=[...$('#qi').querySelectorAll('.cg-nt')].map(x=>x.textContent.replace(/\s+/g,' ').trim()).join(' | ');
if($('#qti').disabled)return{ok:true,done:false,message:'الموظف '+e.name+' لديه إجازة/جزاء في هذا اليوم وتم تسجيله تلقائيًا: '+nt+'. لم أسجل حضورًا — لو عايز تسجل حضوره اضغط «إلغاء هذا اليوم» في الإشعار.'};
const ti=hhmm(a.time_in),to=hhmm(a.time_out);if(!ti&&!to)return{ok:true,done:false,message:'اخترت الموظف والتاريخ. '+nt+' لم يُحدَّد وقت حضور أو انصراف.'};
if(ti)await gSet($('#qti'),ti);if(to){await gSet($('#qto'),to);if(okd(a.out_date)&&a.out_date)await gSet($('#qdo'),a.out_date)}
await gClick(document.querySelector('[data-a=qsave]'));await sleep(700);return{ok:true,done:true,message:'تم الضغط على حفظ'+(dlgOpen()?' وظهرت نافذة قرار (تنبيه تأخير/إجازة/جزاء) تحتاج اختيار المستخدم':'')+'. '+nt}},
async add_permission(a){const f=cgFind(a.employee);if(f.err)return{ok:false,error:f.err};await cgGoto('perm');await gClick(document.querySelector('#view [data-a=new]'));await gSelV($('#g_emp'),f.e.id);await gSet($('#g_date'),okd(a.date));await gSet($('#g_from'),hhmm(a.from));await gSet($('#g_to'),hhmm(a.to));if(a.reason)await gSet($('#g_why'),a.reason);const d=await cgSave();return{ok:true,message:'تم حفظ الإذن'+(d?' (ظهرت نافذة)':'')}},
async add_leave(a){const f=cgFind(a.employee);if(f.err)return{ok:false,error:f.err};await cgGoto('leave');await gClick(document.querySelector('#view [data-a=new]'));await gSelV($('#g_emp'),f.e.id);await gSelT($('#g_type'),a.type||'عارضة');if(a.reason&&$('#g_rsn').offsetParent)await gSelT($('#g_rsn'),a.reason);if(a.note)await gSet($('#g_det'),a.note);await gSet($('#g_from'),okd(a.from));await gSet($('#g_ret'),okd(a.ret||addD(a.to||a.from,1)));await cgSave();return{ok:true,message:'تم حفظ الإجازة'}},

async add_penalty(a){const f=cgFind(a.employee);if(f.err)return{ok:false,error:f.err};await cgGoto('pen');await gClick(document.querySelector('#view [data-a=new]'));await gSelV($('#g_emp'),f.e.id);if(a.date)await gSet($('#g_date'),okd(a.date));
if(!await gSelT($('#g_rsn'),a.reason||'أخرى')){await gSelT($('#g_rsn'),'أخرى');await gSet($('#g_rsd'),a.reason)}
const pn=a.penalty||'خصم يوم';if(!await gSelT($('#g_pen'),pn)){await gSelT($('#g_pen'),'أخرى');await gSet($('#g_pend'),pn);if(a.days)await gSet($('#g_nd'),String(a.days))}
if(a.from)await gSet($('#g_from'),a.from);await cgSave();return{ok:true,message:'تم حفظ الجزاء'}}};
CG_ACT.get_records=async a=>{const c=a.collection;let rows;if(c=='emp')rows=emps().map(r=>{const x=Object.assign({},r);delete x.photo;return x});else if(c=='archive')rows=L('archive',[]).map(r=>({ts:r.ts,sec:r.sec,type:r.type,desc:r.desc}));else rows=D(c).slice();
if(a.employee){const f=cgFind(a.employee);if(f.err)return{ok:false,error:f.err};rows=rows.filter(r=>String(r.emp)==String(f.e.id)||(c=='emp'&&r.id==f.e.id))}
const df=r=>r.wd||r.date||r.from||'';if(a.from)rows=rows.filter(r=>!df(r)||df(r)>=a.from);if(a.to)rows=rows.filter(r=>!df(r)||df(r)<=a.to);const n=rows.length;return{ok:true,count:n,rows:rows.slice(-80),message:'جلبت '+n+' سجل من '+c}};
CG_ACT.read_screen=async()=>({ok:true,text:$('#view').innerText.replace(/\s+/g,' ').slice(0,4000),message:'قرأت محتوى الصفحة الحالية'});
async function cgRun(n,a){CG.busy=true;cgMood('work');try{if(!CG_ACT[n])return{ok:false,error:'أداة غير معروفة'};const r=await CG_ACT[n](a||{});cgAdd('a','🛠 '+(r.message||r.error||n));return r}catch(e){cgAdd('a','⚠️ تعذر التنفيذ: '+e.message);return{ok:false,error:e.message}}finally{if(GH)GH.style.opacity='0';CG.busy=false;cgMood('happy',2200)}}
